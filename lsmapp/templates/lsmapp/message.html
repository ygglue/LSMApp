<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>LSM App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Pacifico&display=swap"
        rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'lsmapp/css/message.css' %}">
</head>

<body>
    <div class="container">
        <div class="message-wrapper">
            <div class="message-box">
                <div id="message-display" class="message-text"></div>
                <div class="typing-indicator" id="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="choices-container" id="choices-container">
            <!-- Choices will be dynamically inserted here -->
        </div>

        <div class="progress-indicator" id="progress-indicator">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <script src="{% static 'lsmapp/js/message.js' %}"></script>
</body>

</html>
